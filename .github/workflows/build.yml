name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build APK (do instalacji na telefonie)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../AplikantDuel.apk

      - name: Build signed AAB (Google Play)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          export KEYSTORE_PATH=$RUNNER_TEMP/upload.jks
          ./gradlew bundleRelease --no-daemon
          mv app/build/outputs/bundle/release/app-release.aab ../AplikantDuel.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aplikant Duel 1.0.${{ github.run_number }}
          body: |
            AplikantDuel.apk - instalacja bezpośrednio na telefonie z Androidem.
            AplikantDuel.aab - plik do Google Play Console (tylko gdy dodano klucz podpisu).
          files: |
            AplikantDuel.apk
            AplikantDuel.aab
          fail_on_unmatched_files: false
